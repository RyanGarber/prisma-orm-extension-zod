name: update prisma

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-prisma-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-prisma:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zod_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --shm-size=1g

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Update Prisma packages
        run: pnpm update --latest @prisma/orm-postgres @prisma/orm-toolchain

      - name: Keep the Prisma peer dependency aligned
        run: node .github/scripts/sync-prisma-peer-version.mjs

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: ZOD_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/zod_test pnpm test

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-prisma
          delete-branch: true
          commit-message: "chore(deps): update Prisma packages"
          title: "chore(deps): update Prisma packages"
          body: |
            Updates the Prisma ORM packages to their latest versions and keeps the peer dependency aligned.

            Lint, typecheck, and the live Postgres test suite passed before this PR was created.
