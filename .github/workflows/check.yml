name: check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
          image: paradedb/paradedb:latest
          env:
              POSTGRES_USER: postgres
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: zod_test
          ports:
              - 5432:5432
          options: >-
              --health-cmd "pg_isready -U postgres -d zod_test"
              --health-interval 10s
              --health-timeout 5s
              --health-retries 10
              --shm-size=1g

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4.0.0

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: ZOD_TEST_DATABASE_URL=postgres://postgres:postgres@localhost:5432/zod_test pnpm test
